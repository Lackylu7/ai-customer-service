services:
  nginx:
    ports: !override
      - "127.0.0.1:${EXPOSE_NGINX_PORT:-8081}:${NGINX_PORT:-80}"
      - "127.0.0.1:${EXPOSE_NGINX_SSL_PORT:-8443}:${NGINX_SSL_PORT:-443}"

  plugin_daemon:
    ports: !override
      - "127.0.0.1:${EXPOSE_PLUGIN_DEBUGGING_PORT:-5003}:${PLUGIN_DEBUGGING_PORT:-5003}"
