app:
  description: __APP_DESCRIPTION__
  icon: 🤖
  icon_background: '#E8F3FF'
  mode: advanced-chat
  name: __DIFY_APP_NAME__
  use_icon_as_answer_icon: false
dependencies: []
kind: app
version: 0.3.1
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      enabled: false
    opening_statement: __OPENING_STATEMENT__
    retriever_resource:
      enabled: true
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions:
    - 公司目前有哪些股东类型？
    - 新店入股金额是多少？
    - 什么时候开始计算分红？
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
  graph:
    edges:
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: start
        targetType: llm
      id: start-to-query-understanding
      source: start
      sourceHandle: source
      target: query-understanding
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: llm
        targetType: knowledge-retrieval
      id: query-understanding-to-knowledge
      source: query-understanding
      sourceHandle: source
      target: knowledge
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: knowledge-retrieval
        targetType: llm
      id: knowledge-to-llm
      source: knowledge
      sourceHandle: source
      target: llm
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: llm
        targetType: answer
      id: llm-to-answer
      source: llm
      sourceHandle: source
      target: answer
      targetHandle: target
      type: custom
      zIndex: 0
    nodes:
    - data:
        desc: 接收客户当前问题。
        selected: false
        title: 开始
        type: start
        variables: []
      height: 90
      id: start
      position:
        x: 30
        y: 260
      positionAbsolute:
        x: 30
        y: 260
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        context:
          enabled: false
          variable_selector: []
        desc: 理解员工自然表达，并生成适合企业知识检索的独立查询。
        memory:
          query_prompt_template: '{{#sys.query#}}'
          window:
            enabled: true
            size: 10
        model:
          completion_params:
            max_tokens: 200
            temperature: 0.1
          mode: chat
          name: deepseek-chat
          provider: langgenius/deepseek/deepseek
        prompt_template:
        - role: system
          text: __QUERY_UNDERSTANDING_PROMPT__
        selected: false
        title: DeepSeek 问题理解
        type: llm
        variables: []
        vision:
          enabled: false
      height: 145
      id: query-understanding
      position:
        x: 340
        y: 260
      positionAbsolute:
        x: 340
        y: 260
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        dataset_ids:
        - __DIFY_DATASET_ID__
        desc: __KNOWLEDGE_DESCRIPTION__
        query_variable_selector:
        - query-understanding
        - text
        retrieval_mode: single
        selected: false
        single_retrieval_config:
          model:
            completion_params: {}
            mode: chat
            name: deepseek-chat
            provider: langgenius/deepseek/deepseek
        title: 知识检索
        type: knowledge-retrieval
      height: 110
      id: knowledge
      position:
        x: 650
        y: 260
      positionAbsolute:
        x: 650
        y: 260
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        context:
          enabled: true
          variable_selector:
          - knowledge
          - result
        desc: 基于检索结果生成受约束的客服答复。
        memory:
          query_prompt_template: '{{#sys.query#}}'
          window:
            enabled: true
            size: 10
        model:
          completion_params:
            max_tokens: 512
            temperature: 0.2
          mode: chat
          name: deepseek-chat
          provider: langgenius/deepseek/deepseek
        prompt_template:
        - role: system
          text: __SYSTEM_PROMPT__
        selected: false
        title: DeepSeek 客服回答
        type: llm
        variables: []
        vision:
          enabled: false
      height: 145
      id: llm
      position:
        x: 960
        y: 260
      positionAbsolute:
        x: 960
        y: 260
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        answer: '{{#llm.text#}}'
        desc: 返回最终客服答复。
        selected: false
        title: 回答
        type: answer
        variables:
        - value_selector:
          - llm
          - text
          variable: text
      height: 105
      id: answer
      position:
        x: 1270
        y: 260
      positionAbsolute:
        x: 1270
        y: 260
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    viewport:
      x: 0
      y: 0
      zoom: 0.7
